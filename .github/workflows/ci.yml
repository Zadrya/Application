name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled, so every merged commit keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Makefile runs Flutter through fvm locally; CI installs the version pinned
# in .fvmrc with tool/install-flutter.sh and calls it directly. The SDK cache is
# per job, so each job keeps the engine artifacts it downloaded.
env:
  FLUTTER: flutter
  DART: dart

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: scripts/install-ci-tools.sh
      - name: Cache the Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/zadrya-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.fvmrc', 'tool/flutter-sdk.lock') }}
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install Flutter
        run: tool/install-flutter.sh "$RUNNER_TOOL_CACHE/zadrya-flutter"
      - name: Lint (Dart format and analyze, workflows, YAML, Markdown, shell)
        run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/zadrya-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.fvmrc', 'tool/flutter-sdk.lock') }}
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install Flutter
        run: tool/install-flutter.sh "$RUNNER_TOOL_CACHE/zadrya-flutter"
      - name: Unit and widget tests, script tests and the coverage gate
        run: make test coverage

  android-build:
    name: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Cache the Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/zadrya-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.fvmrc', 'tool/flutter-sdk.lock') }}
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install Flutter
        run: tool/install-flutter.sh "$RUNNER_TOOL_CACHE/zadrya-flutter"
      - name: Build the debug APK
        run: make build-android-debug

  ios-build:
    name: ios-build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/zadrya-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.fvmrc', 'tool/flutter-sdk.lock') }}
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install Flutter
        run: tool/install-flutter.sh "$RUNNER_TOOL_CACHE/zadrya-flutter"
      - name: Build for the simulator, unsigned
        run: make build-ios-simulator
      - name: Build for release, unsigned
        run: make build-ios-release

  integration-android:
    name: integration-android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Cache the Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/zadrya-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.fvmrc', 'tool/flutter-sdk.lock') }}
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install Flutter
        run: tool/install-flutter.sh "$RUNNER_TOOL_CACHE/zadrya-flutter"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration smoke test on the Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: make integration-test

  integration-ios:
    name: integration-ios
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/zadrya-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.fvmrc', 'tool/flutter-sdk.lock') }}
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install Flutter
        run: tool/install-flutter.sh "$RUNNER_TOOL_CACHE/zadrya-flutter"
      - name: Integration smoke test on the iOS simulator
        run: |
          udid="$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                     | select(.name | startswith("iPhone"))][0].udid')"
          if [[ -z "$udid" || "$udid" == null ]]; then
            echo "error: no available iPhone simulator" >&2
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          make integration-test DEVICE="$udid"
