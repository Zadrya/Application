# SPDX-License-Identifier: GPL-3.0-or-later
version = 1

# Everything in this repository is GPL-3.0-or-later unless a file or a more
# specific annotation says otherwise. Source files also carry an SPDX header.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Zadrya contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Platform projects generated by `flutter create` (Flutter 3.50.0). They are
# kept as generated, apart from the identifiers and minimum OS versions, so they
# carry no SPDX header and are covered by the annotation above.

# The placeholder launcher icons and launch images come from the Flutter
# templates. They are replaced by the Zadrya icon before release.
[[annotations]]
path = [
  "android/app/src/main/res/mipmap-*/ic_launcher.png",
  "ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png",
  "ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2014 The Flutter Authors"
SPDX-License-Identifier = "BSD-3-Clause"
